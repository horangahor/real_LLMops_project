<title id="title">논문 초안 생성 서비스의 현재 Orchestrator–Worker 아키텍처</title>
<desc id="desc">검토된 연구 근거, 골든 샘플 작성 가이드, 고정 장별 지침을 코드가 결합한다. Python 오케스트레이터가 장 작성 5개 역할, 검토 1개 역할, 종합 편집 1개 역할을 조율한다. 검토 통과 후 초안과 검토 보고서를 저장한다. LangGraph 전환 전 구조다.</desc>
